name: build

# 触发：main 分支、PR、版本 tag、手动
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PengchuanTray.csproj

      # 框架依赖单文件：体积小，需要目标机安装 .NET 10 Desktop Runtime
      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish PengchuanTray.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o dist/framework

      # 自包含单文件：目标机零依赖，体积较大（待签名的主要产物）
      - name: Publish (self-contained, single file)
        run: >
          dotnet publish PengchuanTray.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -o dist/self-contained

      # 把 dotnet 启动器随框架依赖版一起发布（Smart App Control 兜底）
      - name: Copy dotnet launcher
        shell: pwsh
        run: Copy-Item scripts/start-tray-dotnet.cmd dist/framework/ -Force

      # 未签名产物会被杀软/企业 EDR 拦截，这里明确写清原因与正解
      - name: Add unsigned-artifact notice
        shell: pwsh
        run: |
          @'
          未签名测试版说明
          ================
          本目录中的 exe 未做 Authenticode 签名，Windows Defender / SmartScreen /
          企业 EDR 会提示「存在安全隐患」并可能直接拦截，这是未签名的正常表现。
          - 仅供内部测试使用，不要分发给终端用户。
          - 正式分发请使用已签名的 Release 产物（配置 SignPath 变量后打 v* tag 生成）。
          - 校验签名：Get-AuthenticodeSignature .\PengchuanTray.exe  （期望 Status=Valid）
          - 校验哈希：与同目录 SHA256SUMS.txt 比对
          - 仍被拦截时：用同目录「启动贴传助手.cmd」经微软签名的 dotnet 宿主启动。
          '@ | Set-Content -Path dist/framework/unsigned-build-notice.txt -Encoding UTF8
          Copy-Item dist/framework/unsigned-build-notice.txt dist/self-contained/ -Force

      # 逐文件校验和，便于接收方核对
      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/framework, dist/self-contained -Recurse -File | Sort-Object FullName
          $lines = foreach ($f in $files) {
            $rel = $f.FullName -replace [regex]::Escape("$PWD\"), ''
            "$((Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $rel"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ASCII

      - name: Upload unsigned framework build
        id: upload-framework
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-framework
          path: dist/framework/**

      - name: Upload unsigned self-contained exe
        id: upload-self-contained
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-self-contained
          path: dist/self-contained/PengchuanTray.exe

      # ------------------------------------------------------------------
      # SignPath Foundation 开源签名（审核通过后启用）
      #
      # 启用前需要在仓库配置：
      #   Secret:    SIGNPATH_API_TOKEN
      #   Variables: SIGNPATH_ORGANIZATION_ID
      #              SIGNPATH_PROJECT_SLUG
      #              SIGNPATH_SIGNING_POLICY_SLUG
      #              SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
      #
      # 说明：
      #   · 只有打 v* tag 且配置了 SIGNPATH_PROJECT_SLUG 时才执行；
      #   · artifact-configuration 需在 SignPath 控制台创建，指定文件名
      #     PengchuanTray.exe；
      #   · action 版本与参数以 SignPath 官方文档为准，升级时请核对。
      # ------------------------------------------------------------------
      - name: Sign with SignPath Foundation
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-self-contained.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed exe
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-self-contained
          path: signed/PengchuanTray.exe

      # 只有签名成功的 tag 构建才创建 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed/PengchuanTray.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
