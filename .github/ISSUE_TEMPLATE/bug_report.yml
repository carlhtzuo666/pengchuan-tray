name: Bug 报告
description: 使用 PengchuanTray 时遇到问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现信息。
  - type: input
    id: version
    attributes:
      label: 版本
      description: GitHub Release 版本或 commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 手机是否处于「等待电脑接入」？托盘是否发现手机？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附 screenshot 或 startup.log（不要粘贴令牌）
    validations:
      required: true
