name: 功能建议 / 使用反馈
description: 想要的功能，或使用体验反馈
title: "[Feedback] "
labels: ["enhancement"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: 你的反馈
      description: 使用场景、希望改进的地方、是否愿意参与测试
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: 联系方式（可选）
      description: GitHub 用户名或邮箱，方便后续沟通
